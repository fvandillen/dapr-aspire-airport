# Dapr state store backed by the Redis that `dapr init` provisions on localhost:6379.
# `actorStateStore: "true"` is required so the Aircraft actors can persist state here.
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: statestore
spec:
  type: state.redis
  version: v1
  metadata:
    - name: redisHost
      value: "localhost:6379"
    - name: redisPassword
      value: ""
    - name: actorStateStore
      value: "true"
